# npkg build environment
# This file is sourced (as KEY=VALUE pairs) into npkg's environment
# before building packages. DO NOT set DESTDIR here — it's overridden
# automatically per-package during install.
CC="clang"

MAKEOPTS="-j6"
CFLAGS="-O2 -pipe"
CXXFLAGS="-O2 -pipe"
LDFLAGS="-L/usr/lib64 -L/usr/lib -Wl,-rpath-link,/usr/lib64:/usr/lib -Wl,-rpath,/usr/lib64:/usr/lib"
PREFIX=/usr

# Xorg-specific build environment (used by packages/xorg-libs and any
# X11-related package). XORG_PREFIX mirrors PREFIX so Xorg libraries
# install into the same tree as everything else, unless you want Xorg
# isolated in its own prefix later. DO NOT set relative variables into
# the prefixes.
XORG_PREFIX=/usr
XORG_CONFIG="--prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static"
